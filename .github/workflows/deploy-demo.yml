# Демо-версия сайта на GitHub Pages: https://dogide2gis-cloud.github.io/sveti-site/
# Запускается после каждого изменения (в т.ч. из админки) и раз в сутки —
# чтобы статусы курсов («Идёт набор / Идёт сейчас / Завершён») обновлялись по датам.
name: Демо-сайт (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 21 * * *'   # 00:07 по Москве
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE: https://dogide2gis-cloud.github.io
          BASE_PATH: /sveti-site
          TZ: Europe/Moscow
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
